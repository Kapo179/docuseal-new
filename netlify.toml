[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Headers Configuration
[[headers]]
  for = "/*"
    [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.stripe.com https://apis.google.com https://accounts.google.com https://*.gstatic.com https://*.firebaseapp.com https://*.google.com https://www.googletagmanager.com;
      connect-src 'self' https://*.stripe.com https://api.docuseal.com https://*.docuseal.com https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.firebaseapp.com https://*.cloudfunctions.net wss: data: blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.gstatic.com;
      img-src 'self' data: https://*.docuseal.com blob:;
      frame-src 'self' https://*.stripe.com https://*.google.com https://*.firebaseapp.com https://*.docuseal.com blob:;
      font-src 'self' data: https://fonts.googleapis.com https://fonts.gstatic.com;
      worker-src 'self' blob:;
      child-src 'self' blob:;
      object-src 'none';
      media-src 'self' blob:;
    """
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Credentials = "true"
    Set-Cookie = "SameSite=None; Secure; HttpOnly"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Embedder-Policy = "credentialless"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirect for API requests to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Redirect for DocuSeal Templates Fetch
[[redirects]]
  from = "/api/contracts/:templateId"
  to = "/.netlify/get-docuseal-contract/:templateId"
  status = 200
  force = true

# Redirect all other routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Functions Settings
[functions]
  node_bundler = "esbuild"

# Environment Variables for Build Time
[build.environment]
DOCUSEAL_API_URL = "https://api.docuseal.com"


# Caching settings for optimization
[[headers]]
  for = "/assets/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
