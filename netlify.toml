[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Headers Configuration
[[headers]]
  for = "/*"
    [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.stripe.com;
      connect-src 'self' https://*.stripe.com https://api.stripe.com https://api.docuseal.com https://*.docuseal.com https://docuseal.com;
      frame-src 'self' https://*.stripe.com https://*.docuseal.com https://docuseal.com;
      img-src 'self' data: https://*.stripe.com https://*.docuseal.com https://docuseal.com;
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      object-src 'none';
      worker-src 'self' blob:;
      child-src 'self' blob:;
    """
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Special headers for DocuSeal resources
[[headers]]
  for = "https://*.docuseal.com/*"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Cache-Control = "no-cache"

[[headers]]
  for = "https://docuseal.com/*"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Cache-Control = "no-cache"

# Special headers for PDF and image resources
[[headers]]
  for = "/*.pdf"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Content-Type = "application/pdf"
    Content-Disposition = "inline"

[[headers]]
  for = "/*.{jpg,jpeg,png,gif,webp}"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=31536000, immutable"

# Special headers for Stripe resources
[[headers]]
  for = "https://js.stripe.com/*"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, Stripe-Version, Stripe-Signature"
    Cache-Control = "no-cache"

[[headers]]
  for = "https://api.stripe.com/*"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, Stripe-Version, Stripe-Signature"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.stripe.com/*"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Access-Control-Allow-Origin = "*"

# Redirect for API requests to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
  headers = {Cross-Origin-Resource-Policy = "same-site"}

# Redirect for DocuSeal Templates Fetch
[[redirects]]
  from = "/api/get-docuseal-contract/:templateId"
  to = "/.netlify/functions/get-docuseal-contract"
  status = 200
  query = { templateId = ":templateId" }

# Redirect all other routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Functions Settings
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium"]

# Environment Variables for Build Time
[build.environment]
DOCUSEAL_API_URL = "https://api.docuseal.com"

# Caching settings for optimization
[[headers]]
  for = "/assets/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"