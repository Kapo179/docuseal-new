[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Headers Configuration
[[headers]]
  for = "/*"
    [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.stripe.com https://*.js.stripe.com https://js.stripe.com https://maps.googleapis.com;
      connect-src 'self' https://*.stripe.com https://api.stripe.com https://checkout.stripe.com https://maps.googleapis.com;
      frame-src 'self' https://*.stripe.com https://*.js.stripe.com https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com;
      img-src 'self' data: https://*.stripe.com https://*.docuseal.com https://docuseal.com;
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      object-src 'none';
      worker-src 'self' blob:;
    """
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Opener-Policy = "unsafe-none"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, Stripe-Version, Stripe-Signature"
    Access-Control-Allow-Credentials = "true"

# Single header for all Stripe resources
[[headers]]
  for = "https://*.stripe.com/*"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Opener-Policy = "unsafe-none"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Access-Control-Allow-Credentials = "true"
    Access-Control-Expose-Headers = "*"
    Timing-Allow-Origin = "*"
    Cache-Control = "no-cache"

# Redirect for API requests to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
  headers = {Cross-Origin-Resource-Policy = "cross-origin"}

# Redirect for DocuSeal Templates Fetch
[[redirects]]
  from = "/api/get-docuseal-contract/:templateId"
  to = "/.netlify/functions/get-docuseal-contract"
  status = 200
  query = { templateId = ":templateId" }

# Redirect all other routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Functions Settings
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["node_modules/@sparticuz/chromium/**/*"]
  external_node_modules = ["@sparticuz/chromium"]

[functions.tailorCV]
  timeout = "30s"

[functions.checkCVStatus]
  timeout = "30s"

# Environment Variables for Build Time
[build.environment]
DOCUSEAL_API_URL = "https://api.docuseal.com"
AWS_LAMBDA_JS_RUNTIME = "nodejs18.x"
CHROME_EXECUTABLE_PATH = "/var/task/node_modules/@sparticuz/chromium/bin/chromium"

# Caching settings for optimization
[[headers]]
  for = "/assets/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"