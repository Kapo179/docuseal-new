[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Headers Configuration
[[headers]]
  for = "/*"
    [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.stripe.com https://js.stripe.com https://apis.google.com https://accounts.google.com https://*.gstatic.com https://*.firebaseapp.com https://*.google.com https://www.googletagmanager.com;
      connect-src 'self' https://*.stripe.com https://api.stripe.com https://api.docuseal.com https://*.docuseal.com https://docuseal.com https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.firebaseapp.com https://*.cloudfunctions.net wss: data: blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.gstatic.com https://*.stripe.com;
      img-src 'self' data: https://*.docuseal.com https://docuseal.com https://*.stripe.com blob:;
      frame-src 'self' https://*.stripe.com https://js.stripe.com https://hooks.stripe.com https://*.google.com https://accounts.google.com https://*.firebaseapp.com https://*.docuseal.com https://docuseal.com blob:;
      font-src 'self' data: https://fonts.googleapis.com https://fonts.gstatic.com;
      worker-src 'self' blob: https://*.stripe.com;
      child-src 'self' blob: https://*.stripe.com;
      object-src 'none';
      media-src 'self' blob:;
    """
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, Stripe-Version, Stripe-Signature"
    Access-Control-Allow-Credentials = "true"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Timing-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Special headers for DocuSeal resources
[[headers]]
  for = "https://*.docuseal.com/*"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# Special headers for PDF and image resources
[[headers]]
  for = "/*.pdf"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Content-Type = "application/pdf"
    Content-Disposition = "inline"

[[headers]]
  for = "/*.{jpg,jpeg,png,gif,webp}"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=31536000, immutable"

# Special headers for Stripe resources
[[headers]]
  for = "https://*.stripe.com/*"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, Stripe-Version, Stripe-Signature"
    Timing-Allow-Origin = "*"
    Cache-Control = "max-age=60, stale-while-revalidate=900"

# Special headers for Stripe controller
[[headers]]
  for = "/v3/controller-with-preconnect-*.html"
    [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "max-age=60, stale-while-revalidate=900"
    Timing-Allow-Origin = "*"

# Redirect for API requests to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
  headers = {Cross-Origin-Resource-Policy = "same-site"}

# Redirect for DocuSeal Templates Fetch
[[redirects]]
  from = "/api/get-docuseal-contract/:templateId"
  to = "/.netlify/functions/get-docuseal-contract"
  status = 200
  query = { templateId = ":templateId" }

# Redirect all other routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Functions Settings
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium"]

# Environment Variables for Build Time
[build.environment]
DOCUSEAL_API_URL = "https://api.docuseal.com"

# Caching settings for optimization
[[headers]]
  for = "/assets/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/payment"
    [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.stripe.com;
      connect-src 'self' https://*.stripe.com https://api.stripe.com;
      frame-src 'self' https://*.stripe.com;
      img-src 'self' data: https://*.stripe.com;
      style-src 'self' 'unsafe-inline';
    """
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "cross-origin"